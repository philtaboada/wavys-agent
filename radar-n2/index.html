<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RADAR N°2 · el buzón se come la silla</title>
    <style>
      :root { --ink: #14130f; --news: #ece9e1; --signal: #e2452b; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #29292b; color: var(--news); font-family: Georgia, serif; }
      header {
        max-width: 1240px; margin: 0 auto; padding: 28px 24px 18px;
        display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      }
      header b { font-family: ui-monospace, monospace; letter-spacing: 0.22em; text-transform: uppercase; }
      header span { color: #9a968c; font-size: 14px; }
      .toc { max-width: 1240px; margin: 0 auto 28px; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px; }
      .toc a {
        color: var(--news); text-decoration: none; font-family: ui-monospace, monospace;
        font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
        border: 1px solid #5a5750; padding: 8px 12px;
      }
      .toc a:hover, .toc a.on { background: var(--signal); border-color: var(--signal); color: #fff; }
      .stage { display: flex; justify-content: center; padding: 0 16px 64px; }
      iframe {
        width: 1240px; height: 1754px; border: 0; background: #111;
        box-shadow: 0 24px 80px rgba(0,0,0,.55);
      }
    </style>
  </head>
  <body>
    <header>
      <b>Radar N°2</b>
      <span>14 — 21 ago 2026 · 11 páginas a 1240×1754</span>
    </header>
    <nav class="toc" id="toc"></nav>
    <div class="stage">
      <iframe id="frame" title="Página de RADAR N°2"></iframe>
    </div>
    <script>
      const pages = [
        ["01-tapa.html", "01 Tapa"],
        ["02-carta-del-editor.html", "02 Carta"],
        ["03-senal.html", "03 Señal"],
        ["04a-tema-central-apertura.html", "04a Apertura"],
        ["04b-tema-central-relato.html", "04b Relato"],
        ["04c-tema-central-casos.html", "04c Casos"],
        ["04d-tema-central-cita-datos.html", "04d Cita"],
        ["04e-tema-central-reglas.html", "04e Cierre"],
        ["05-mas-noticias.html", "05 Más notas"],
        ["08-tablero-ia.html", "08 Tablero"],
        ["09-contratapa.html", "09 Contratapa"],
      ];
      const toc = document.getElementById("toc");
      const frame = document.getElementById("frame");
      const first = new URLSearchParams(location.search).get("p") || pages[0][0];
      pages.forEach(([file, label]) => {
        const a = document.createElement("a");
        a.href = "?p=" + file;
        a.textContent = label;
        if (file === first) a.className = "on";
        a.addEventListener("click", (e) => {
          e.preventDefault();
          frame.src = file;
          toc.querySelectorAll("a").forEach((el) => el.classList.remove("on"));
          a.classList.add("on");
          history.replaceState(null, "", "?p=" + file);
        });
        toc.appendChild(a);
      });
      frame.src = first;
    </script>
  </body>
</html>
