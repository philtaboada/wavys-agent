<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>RADAR N°2 — 04 Apertura</title>
    <link rel="stylesheet" href="css/radar.css" />
    <style>
      /* ============================================================
         04 · APERTURA — type-first. La página ES la hoja.
         Titular sobre el corte, no ficha al costado.
         Grilla de celdas vacías (ilegible a propósito). Sin cara.
         Si foto+velo+letras = poster → esto no lo es: el tipo
         vive debajo del corte, en papel.
         ============================================================ */

      .page {
        background: var(--paper);
        color: #0c0b09;
      }

      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 820px;
        z-index: 2;
        overflow: hidden;
        background: #12100e;
      }

      .sheet__grid {
        position: absolute;
        left: 48px;
        right: 48px;
        top: 118px;
        bottom: 0;
        display: grid;
        grid-template-columns: 54px repeat(8, 1fr);
        grid-template-rows: 36px repeat(12, 1fr);
        gap: 0;
        border: 1px solid rgba(253, 253, 253, 0.14);
      }

      .sheet__grid span {
        border-right: 1px solid rgba(253, 253, 253, 0.1);
        border-bottom: 1px solid rgba(253, 253, 253, 0.1);
      }

      .sheet__grid .h {
        background: rgba(253, 253, 253, 0.06);
      }

      .sheet__grid .cell-on {
        background: rgba(90, 210, 208, 0.28);
      }

      .sheet__grid .gutter {
        background: rgba(253, 253, 253, 0.04);
        font-family: var(--mono);
        font-size: 10px;
        color: rgba(253, 253, 253, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.08em;
      }

      .cut {
        position: absolute;
        left: 0;
        right: 0;
        top: 796px;
        height: 48px;
        z-index: 12;
        background: linear-gradient(180deg, rgba(7, 6, 4, 0.55) 0%, rgba(242, 237, 227, 0) 100%);
        border-top: 3px solid #0c0b09;
      }

      .open {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 868px;
        z-index: 14;
      }

      .open__k {
        font-family: var(--sans);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #0f6b6a;
        margin-bottom: 14px;
      }

      h1 {
        font-weight: 400;
      }

      h1 .l1 {
        display: block;
        font-family: var(--sans);
        font-weight: 500;
        font-stretch: 92%;
        font-size: 42px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #3a362c;
      }

      h1 .l2 {
        display: block;
        margin-top: 6px;
        font-family: var(--read);
        font-style: italic;
        font-size: 48px;
        line-height: 1;
        color: #1a1813;
      }

      h1 .l3 {
        display: block;
        margin-top: 4px;
        font-family: var(--display);
        font-variation-settings: "SOFT" 12, "WONK" 1, "opsz" 144;
        font-weight: 900;
        font-size: 168px;
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: #0c0b09;
      }

      .dek {
        margin-top: 22px;
        max-width: 28em;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.35;
        color: #1a1813;
      }

      .cap {
        position: absolute;
        right: 74px;
        top: 136px;
        z-index: 8;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(253, 253, 253, 0.45);
        text-align: right;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <article class="page page--paper grain">
      <div class="sheet" aria-hidden="true">
        <div class="sheet__grid">
          <span class="gutter"></span>
          <span class="h"></span><span class="h"></span><span class="h"></span><span class="h"></span>
          <span class="h"></span><span class="h"></span><span class="h"></span><span class="h"></span>
          <span class="gutter">01</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">02</span><span></span><span class="cell-on"></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">03</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">04</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">05</span><span></span><span></span><span></span><span class="cell-on"></span><span></span><span></span><span></span><span></span>
          <span class="gutter">06</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">07</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">08</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">09</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">10</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">11</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="gutter">12</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="cut" aria-hidden="true"></div>

      <header class="head" style="color: #fdfdfd; border-bottom-color: rgba(253,253,253,0.18);">
        <span class="head__mast">Radar</span>
        <span class="head__section" style="color: rgba(253,253,253,0.45);">Tema central · la hoja</span>
      </header>

      <p class="cap">Escena de operación<br />celdas vacías · sin interfaz</p>

      <div class="open">
        <p class="open__k">Apertura · Excel</p>
        <h1>
          <span class="l1">el modelo nuevo</span>
          <span class="l2">no arregla</span>
          <span class="l3">la hoja</span>
        </h1>
        <p class="dek">de siempre. La pantalla, si está, va ilegible. El sistema es la fila.</p>
      </div>

      <footer class="folio">
        <span class="folio__ticks"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></span>
        <span>N°2 · Borrador · 17–21 ago 2026</span>
        <span class="folio__num">04</span>
      </footer>
    </article>
  </body>
</html>
