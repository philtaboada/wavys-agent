<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>RADAR N°1 — 04 Tema central · Grok Bot</title>
    <link rel="stylesheet" href="css/radar.css" />
    <link rel="stylesheet" href="css/tema-grok.css" />
    <style>
      /* ============================================================
         04a · EL CORAZÓN — Grok Bot / xAI.
         Identidad: GROK BOT (Inter). Cascada: sigue / sin ti.
         Color de sección: #FF7A17. Cero teal.
         ============================================================ */

      .hero {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 48% 42%;
        display: block;
        filter: saturate(1.05) contrast(1.12) brightness(0.88) sepia(0.18);
      }

      .hero__veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.28) 22%, rgba(0, 0, 0, 0) 34%),
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0) 36%,
            rgba(0, 0, 0, 0.28) 50%,
            rgba(0, 0, 0, 0.78) 64%,
            rgba(0, 0, 0, 0.96) 80%,
            #000 100%
          ),
          radial-gradient(70% 50% at 88% 18%, rgba(255, 122, 23, 0.22) 0%, rgba(255, 122, 23, 0) 62%);
      }

      .badge {
        position: absolute;
        right: 56px;
        top: 148px;
        z-index: 8;
        width: 268px;
      }

      .badge img {
        width: 100%;
        height: 268px;
        object-fit: cover;
        object-position: 50% 48%;
        display: block;
        filter: contrast(1.08) saturate(1.1);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      }

      .badge p {
        margin-top: 12px;
        font-family: var(--grok);
        font-weight: 500;
        font-size: 10.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(253, 253, 253, 0.5);
        text-align: right;
      }

      .open {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        bottom: 168px;
        z-index: 12;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      .brand img {
        width: 72px;
        height: 72px;
        display: block;
        flex: none;
      }

      .brand span {
        font-family: var(--grok);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--heart);
      }

      .brand em {
        font-style: normal;
        color: rgba(253, 253, 253, 0.45);
        letter-spacing: 0.2em;
      }

      .wordmark {
        display: block;
        font-size: 118px;
        letter-spacing: -0.05em;
        color: #fff;
        text-shadow: 0 12px 50px rgba(0, 0, 0, 0.65);
      }

      h1 {
        margin-top: 18px;
        font-weight: 400;
      }

      h1 .l1 {
        display: block;
        font-family: var(--grok);
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.14em;
        color: rgba(253, 253, 253, 0.62);
      }

      h1 .l2 {
        display: block;
        font-family: var(--display);
        font-variation-settings: "SOFT" 18, "WONK" 0, "opsz" 144;
        font-weight: 900;
        font-size: 132px;
        line-height: 0.8;
        letter-spacing: -0.045em;
        color: var(--heart);
        margin-top: 4px;
        text-shadow: 0 10px 60px rgba(0, 0, 0, 0.7);
      }

      .dek {
        margin-top: 28px;
        max-width: 820px;
        font-family: var(--read);
        font-size: 26px;
        line-height: 1.38;
        color: rgba(253, 253, 253, 0.92);
      }

      .one-line {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        bottom: 118px;
        z-index: 12;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 30px;
        border-top: 2px solid var(--heart);
        padding-top: 14px;
      }

      .one-line p {
        font-family: var(--grok);
        font-weight: 500;
        font-size: 18px;
        letter-spacing: -0.01em;
        color: rgba(253, 253, 253, 0.9);
      }

      .one-line span {
        flex: none;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--heart);
      }
    </style>
  </head>
  <body>
    <article class="page page--grok grain">
      <figure class="hero">
        <img
          src="img/escena-bot-pega.jpg"
          alt="Escritorio de noche: pruebas de revista, lápiz rojo, lámpara y una laptop encendida"
        />
        <div class="hero__veil"></div>
      </figure>

      <header class="head">
        <span class="head__mast">Radar</span>
        <span class="head__section">Tema central · Grok Bot · xAI</span>
      </header>

      <figure class="badge">
        <img src="img/escena-grok-marca.jpg" alt="Marca de sección: una X de metal en el taller, luz naranja" />
        <p>xAI · Grok Bot · 11 ago 2026 · early beta</p>
      </figure>

      <div class="open">
        <p class="brand">
          <img src="img/marks/grok-bot-on-dark.svg" alt="" />
          <span>Grok Bot <em>· xAI · early beta</em></span>
        </p>
        <span class="wordmark">Grok Bot</span>
        <h1>
          <span class="l1">Los bots</span>
          <span class="l2">se hablan</span>
        </h1>
        <p class="dek">
          Creo varios. Se hablan. Yo doy el ok.
        </p>
      </div>

      <div class="one-line">
        <p>Ellos se hablan. Yo doy el ok.</p>
        <span>11 ago · x.ai/bot</span>
      </div>

      <footer class="folio">
        <span class="folio__ticks"><i></i><i></i><i class="on"></i><i></i></span>
        <span>Radar N°1 · Grok Bot</span>
        <span class="folio__num">04</span>
      </footer>
    </article>
  </body>
</html>
