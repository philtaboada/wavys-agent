<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Presencia Digital — Llévate tu web</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

    :root {
      --green-dark: #1a4d3e;
      --green-mid: #2d6a4f;
      --accent: #40916c;
      --cream: #f5f0e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .poster {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: var(--cream);
    }

    /* Escena: modelo + celular compuesto */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 52% 36%;
    }

    .giant-phone {
      position: absolute;
      left: 168px;
      top: 562px;
      width: 448px;
      z-index: 1;
      transform: rotate(-9deg);
      transform-origin: 22% 88%;
      filter: drop-shadow(10px 22px 32px rgba(0, 0, 0, 0.28));
    }

    .phone-frame {
      background: linear-gradient(160deg, #3a3a3a 0%, #111 55%, #0a0a0a 100%);
      border-radius: 34px;
      padding: 12px 12px 18px;
      border: 2px solid #555;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -2px 6px rgba(0,0,0,0.5);
    }

    .phone-notch {
      width: 38%;
      height: 6px;
      background: #0a0a0a;
      border-radius: 999px;
      margin: 0 auto 10px;
    }

    .phone-screen {
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 9 / 16.2;
      background: #eef6f1;
      line-height: 0;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52%;
      background: linear-gradient(
        180deg,
        rgba(245, 240, 232, 0.97) 0%,
        rgba(245, 240, 232, 0.88) 55%,
        rgba(245, 240, 232, 0) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      padding: 72px 64px 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .brand {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green-dark);
      text-align: center;
      margin-bottom: 48px;
    }

    .headline {
      font-family: 'DM Sans', sans-serif;
      font-size: 88px;
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--green-dark);
      max-width: 920px;
    }

    .headline em {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      text-transform: none;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .subline {
      margin-top: 32px;
      font-family: 'DM Sans', sans-serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--green-mid);
      max-width: 780px;
    }

    .price-row {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .price-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      background: var(--green-dark);
      color: #fff;
      padding: 16px 28px;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
    }

    .price-pill .from {
      font-size: 18px;
      font-weight: 500;
      opacity: 0.85;
    }

    .price-pill .amount {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .price-pill .period {
      font-size: 18px;
      font-weight: 500;
      opacity: 0.9;
    }

    .includes {
      font-size: 20px;
      color: var(--green-mid);
      font-weight: 500;
    }

    .bottom {
      margin-top: auto;
      padding-bottom: 72px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: var(--green-dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
      font-weight: 600;
      padding: 20px 36px;
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(26, 77, 62, 0.12);
      text-decoration: none;
      pointer-events: auto;
    }

    .cta-arrow { font-size: 20px; }

    .url {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--green-dark);
      opacity: 0.75;
      text-align: right;
      max-width: 420px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <article class="poster">
    <div class="scene">
      <img class="hero-img" src="promo-woman-walk-base.jpg" alt="" />
      <div class="giant-phone" aria-hidden="true">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <img src="promo-mobile-ui-screen.jpg" alt="" />
          </div>
        </div>
      </div>
    </div>

    <div class="overlay-top"></div>

    <div class="content">
      <p class="brand">Wavys · Presencia Digital</p>

      <h1 class="headline">
        Llévate tu web <em>profesional</em>
      </h1>

      <p class="subline">
        Dominio, hosting, SEO y soporte en una sola cuota — publicada en días, no meses.
      </p>

      <div class="price-row">
        <div class="price-pill">
          <span class="from">desde</span>
          <span class="amount">S/149</span>
          <span class="period">/mes</span>
        </div>
        <span class="includes">12 meses de servicio · después tú decides</span>
      </div>

      <footer class="bottom">
        <a class="cta" href="#">Conoce más <span class="cta-arrow">→</span></a>
        <p class="url">software.wavys-technologies.com/presencia-digital</p>
      </footer>
    </div>
  </article>
</body>
</html>
