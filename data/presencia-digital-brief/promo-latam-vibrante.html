<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Presencia Digital — LatAm vibrante</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,800;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

    :root {
      --coral: #FF6B4A;
      --teal: #00C9A7;
      --yellow: #FFD23F;
      --green-dark: #0d3d32;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .poster {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--coral) 0%, #ff8f6b 40%, var(--teal) 100%);
    }

    /* Una sola foto — ella agarra el celular con la web (sin overlays) */
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      display: block;
      z-index: 0;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 52px 48px 36px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.97) 0%,
        rgba(255, 255, 255, 0.88) 65%,
        rgba(255, 255, 255, 0) 100%
      );
    }

    .brand {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--coral);
      text-align: center;
      margin-bottom: 16px;
    }

    .headline {
      font-family: 'DM Sans', sans-serif;
      font-size: 68px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-align: center;
      color: var(--green-dark);
    }

    .headline .accent {
      background: linear-gradient(90deg, var(--coral), var(--teal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .headline em {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      text-transform: none;
      font-size: 0.72em;
      display: block;
      margin-top: 8px;
      color: var(--teal);
      -webkit-text-fill-color: var(--teal);
    }

    .price-row {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }

    .price-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      background: linear-gradient(90deg, var(--coral), #ff8f50);
      color: var(--white);
      padding: 12px 28px;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 8px 28px rgba(255, 107, 74, 0.35);
    }

    .price-pill .from { font-size: 16px; font-weight: 600; opacity: 0.9; }
    .price-pill .amount { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
    .price-pill .period { font-size: 16px; font-weight: 600; }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 80px 48px 52px;
      background: linear-gradient(
        0deg,
        rgba(13, 61, 50, 0.92) 0%,
        rgba(13, 61, 50, 0.6) 50%,
        rgba(13, 61, 50, 0) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      max-width: 720px;
      line-height: 1.35;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow);
      color: var(--green-dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      padding: 18px 36px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(255, 210, 63, 0.4);
    }

    .url {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--teal);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <article class="poster">
    <img class="hero-img" src="promo-latam-holding-phone-premium.jpg" alt="" />

    <header class="top-bar">
      <p class="brand">Wavys · Presencia Digital</p>
      <h1 class="headline">
        <span class="accent">Llévate tu web</span>
        <em>en una cuota mensual</em>
      </h1>
      <div class="price-row">
        <div class="price-pill">
          <span class="from">desde</span>
          <span class="amount">S/149</span>
          <span class="period">/mes</span>
        </div>
      </div>
    </header>

    <footer class="bottom-bar">
      <p class="sub">Dominio · hosting · SEO · WhatsApp · publicada en días</p>
      <div class="cta-row">
        <a class="cta" href="#">Conoce más →</a>
        <span class="url">software.wavys-technologies.com/presencia-digital</span>
      </div>
    </footer>
  </article>
</body>
</html>
