<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Slide 02 — Detecta</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 80% 45% at 50% 18%, rgba(90,210,208,0.26) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 85% 85%, rgba(1,253,145,0.16) 0%, transparent 50%),
        #070604;
    }
    .cutout {
      position: absolute; left: 50%; top: 170px; transform: translateX(-50%);
      width: 820px; height: auto;
      filter: drop-shadow(0 24px 50px rgba(1,253,145,0.28));
      pointer-events: none;
    }
    .top {
      position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; justify-content: space-between; align-items: center; z-index: 2;
    }
    .pill {
      border: 2px solid #5AD2D0; color: #5AD2D0; font-size: 20px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 20px; border-radius: 999px;
    }
    .src { font-size: 22px; font-weight: 600; color: rgba(253,253,253,0.5); }
    .band {
      position: absolute; left: 48px; right: 48px; bottom: 140px; z-index: 2;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(90,210,208,0.25);
      border-radius: 32px;
      padding: 44px 48px 48px;
    }
    h1 {
      font-size: 52px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.05;
      margin-bottom: 18px;
    }
    h1 .x { color: rgba(253,253,253,0.55); text-decoration: line-through; text-decoration-color: #01FD91; }
    h1 .a { color: #01FD91; }
    .body {
      font-size: 28px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.88); max-width: 900px;
    }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 48px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 40px; }
    .note { font-size: 20px; font-weight: 600; color: rgba(253,253,253,0.4); }
  </style>
</head>
<body>
  <div class="c">
    <img class="cutout" src="assets/wave-p-cutout.png" alt="" />
    <div class="top">
      <div class="pill">Física, no magia</div>
      <div class="src">02 / 05</div>
    </div>
    <div class="band">
      <h1>No <span class="x">predice</span> el sismo.<br>Lo <span class="a">detecta</span>.</h1>
      <p class="body">Cuando la tierra se mueve, primero viaja una onda rápida y débil. Después llega la fuerte —la que sientes.</p>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="note">Onda P → alerta · Onda S → temblor</div>
    </div>
  </div>
</body>
</html>
