<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Slide 00 — Carátula (editable)</title>
  <!--
    EDITABLE — carátula del carrusel
    Cambia solo los textos marcados con data-edit="..."
    Luego regenera PNG:
      bun run generate-pngs.ts
    (incluye slide-00-cover)
  -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 90% 55% at 70% 20%, rgba(90,210,208,0.34) 0%, transparent 58%),
        radial-gradient(ellipse 70% 45% at 15% 85%, rgba(1,253,145,0.22) 0%, transparent 52%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(1,253,145,0.08) 0%, transparent 70%),
        #070604;
    }
    .cutout-phone {
      position: absolute; right: -90px; top: 180px;
      width: 720px; height: auto;
      filter: drop-shadow(0 32px 70px rgba(90,210,208,0.4));
      transform: rotate(10deg);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 56% 50% at 48% 46%, #000 52%, transparent 76%);
      mask-image: radial-gradient(ellipse 56% 50% at 48% 46%, #000 52%, transparent 76%);
      opacity: 0.95;
    }
    .cutout-wave {
      position: absolute; left: -120px; top: 420px;
      width: 560px; height: auto;
      filter: drop-shadow(0 20px 40px rgba(1,253,145,0.25));
      transform: rotate(-8deg);
      opacity: 0.55;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 25%, #000 70%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 25%, #000 70%, transparent 100%);
    }
    .top {
      position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; justify-content: space-between; align-items: center; z-index: 3;
    }
    .pill {
      background: #01FD91; color: #000; font-size: 20px; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px;
    }
    .series {
      font-size: 20px; font-weight: 700; color: #5AD2D0;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .hero {
      position: absolute; left: 64px; top: 200px; width: 620px; z-index: 3;
    }
    .eyebrow {
      font-size: 26px; font-weight: 600; color: rgba(253,253,253,0.65);
      letter-spacing: -0.02em; margin-bottom: 22px;
    }
    h1 {
      font-size: 72px; font-weight: 800; letter-spacing: -0.08em; line-height: 0.98;
      margin-bottom: 28px;
      text-shadow: 0 6px 50px rgba(0,0,0,0.85);
    }
    h1 .a { color: #01FD91; }
    .sub {
      font-size: 30px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.88); max-width: 520px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.7);
    }
    .bottom-card {
      position: absolute; left: 48px; right: 48px; bottom: 140px; z-index: 3;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      background: rgba(0,0,0,0.42);
      border: 1px solid rgba(90,210,208,0.28);
      border-radius: 28px;
      padding: 28px 36px;
      backdrop-filter: blur(10px);
    }
    .meta {
      font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.85); line-height: 1.35;
    }
    .meta strong { color: #01FD91; font-weight: 800; }
    .swipe {
      flex-shrink: 0;
      background: #01FD91; color: #000;
      font-size: 24px; font-weight: 800;
      padding: 16px 28px; border-radius: 18px;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 52px; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 44px; }
    .note {
      font-size: 20px; font-weight: 600;
      color: rgba(253,253,253,0.4);
      letter-spacing: 0.04em;
    }

    /* Modo edición: outlines suaves al hover de textos editables */
    [data-edit]:hover {
      outline: 2px dashed rgba(1,253,145,0.55);
      outline-offset: 6px;
      cursor: text;
    }
  </style>
</head>
<body>
  <div class="c">
    <img class="cutout-wave" src="assets/wave-p-cutout.png" alt="" />
    <img class="cutout-phone" src="assets/phone-alert-cutout.png" alt="" />

    <div class="top">
      <!-- EDIT: pill superior izquierda -->
      <div class="pill" data-edit="pill">Tech tip · Android</div>
      <!-- EDIT: etiqueta serie -->
      <div class="series" data-edit="series">Carrusel · 5 slides</div>
    </div>

    <div class="hero">
      <!-- EDIT: línea corta arriba del título -->
      <div class="eyebrow" data-edit="eyebrow">Antes de que lo sientas</div>
      <!-- EDIT: título principal — usa <span class="a"> para verde -->
      <h1 data-edit="title">
        Tu Android puede avisarte de un <span class="a">terremoto</span>
      </h1>
      <!-- EDIT: subtítulo -->
      <p class="sub" data-edit="subtitle">
        No predice. Detecta. Y te da segundos para protegerte.
      </p>
    </div>

    <div class="bottom-card">
      <!-- EDIT: texto de la franja inferior -->
      <div class="meta" data-edit="meta">
        Con los temblores recientes,<br>
        <strong>mejor prevenidos.</strong>
      </div>
      <!-- EDIT: CTA swipe -->
      <div class="swipe" data-edit="cta">Desliza →</div>
    </div>

    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <!-- EDIT: nota pie -->
      <div class="note" data-edit="footer">Cómo funciona · en 5 pasos</div>
    </div>
  </div>
</body>
</html>
