<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Slide 04 — Red</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, rgba(90,210,208,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 20% 90%, rgba(1,253,145,0.18) 0%, transparent 50%),
        #070604;
    }
    .cutout {
      position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
      width: 780px; height: auto;
      filter: drop-shadow(0 20px 50px rgba(90,210,208,0.35));
      pointer-events: none;
    }
    .top {
      position: absolute; top: 56px; left: 64px; right: 64px; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pill {
      background: #01FD91; color: #000; font-size: 20px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px;
    }
    .src { font-size: 22px; font-weight: 600; color: #5AD2D0; }
    .steps {
      position: absolute; left: 48px; right: 48px; bottom: 140px; z-index: 2;
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
    }
    .step {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(90,210,208,0.22);
      border-radius: 24px;
      padding: 28px 24px;
      min-height: 210px;
    }
    .n {
      font-size: 20px; font-weight: 800; color: #01FD91; letter-spacing: 0.04em;
      margin-bottom: 14px;
    }
    .t {
      font-size: 26px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.2;
    }
    .headline {
      position: absolute; left: 64px; right: 64px; bottom: 380px; z-index: 2;
      text-align: center;
    }
    h1 {
      font-size: 44px; font-weight: 800; letter-spacing: -0.06em; line-height: 1.08;
      text-shadow: 0 4px 30px rgba(0,0,0,0.85);
    }
    h1 .a { color: #01FD91; }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 48px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 40px; }
    .note { font-size: 20px; font-weight: 600; color: rgba(253,253,253,0.45); max-width: 520px; text-align: right; }
  </style>
</head>
<body>
  <div class="c">
    <img class="cutout" src="assets/network-phones-cutout.png" alt="" />
    <div class="top">
      <div class="pill">04 / 05</div>
      <div class="src">Confirmación en red</div>
    </div>
    <div class="headline">
      <h1>Miles de teléfonos.<br><span class="a">Una alerta.</span></h1>
    </div>
    <div class="steps">
      <div class="step">
        <div class="n">01</div>
        <div class="t">Señales de celulares quietos cerca</div>
      </div>
      <div class="step">
        <div class="n">02</div>
        <div class="t">Google confirma el temblor</div>
      </div>
      <div class="step">
        <div class="n">03</div>
        <div class="t">Alerta por internet — más rápida que la onda fuerte</div>
      </div>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="note">Internet gana a la onda S</div>
    </div>
  </div>
</body>
</html>
