<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Slide 03 — Acelerómetro</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background:
        radial-gradient(ellipse 60% 50% at 78% 42%, rgba(90,210,208,0.3) 0%, transparent 55%),
        radial-gradient(ellipse 45% 35% at 12% 80%, rgba(1,253,145,0.14) 0%, transparent 50%),
        #070604;
    }
    .left {
      padding: 64px 40px 64px 64px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 2;
    }
    .pill {
      align-self: flex-start;
      background: #01FD91; color: #000; font-size: 20px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px;
    }
    .mid { margin-top: 120px; }
    .kicker {
      font-size: 24px; font-weight: 600; color: #5AD2D0; margin-bottom: 18px; letter-spacing: -0.02em;
    }
    h1 {
      font-size: 54px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.02;
      margin-bottom: 28px;
    }
    h1 .a { color: #01FD91; }
    .body {
      font-size: 28px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.88); max-width: 420px;
    }
    .logo { height: 44px; }
    .right {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .cutout {
      width: 560px; height: auto;
      filter: drop-shadow(0 30px 55px rgba(90,210,208,0.32));
      transform: rotate(-4deg);
    }
    .badge {
      position: absolute; bottom: 180px; right: 48px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(1,253,145,0.4);
      color: #01FD91;
      font-size: 22px; font-weight: 700;
      padding: 14px 22px; border-radius: 18px;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="c">
    <div class="left">
      <div class="pill">03 / 05</div>
      <div class="mid">
        <div class="kicker">El sensor ya está ahí</div>
        <h1>Tu celular <span class="a">quieto</span> ya tiene el detector.</h1>
        <p class="body">El acelerómetro —el mismo que rota la pantalla— siente esa primera onda.</p>
      </div>
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
    </div>
    <div class="right">
      <img class="cutout" src="assets/phone-still-cutout.png" alt="" />
      <div class="badge">Sin moverse</div>
    </div>
  </div>
</body>
</html>
