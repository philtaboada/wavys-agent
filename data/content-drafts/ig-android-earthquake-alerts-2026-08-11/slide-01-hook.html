<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Slide 01 — Hook</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 75% 50% at 90% 28%, rgba(90,210,208,0.32) 0%, transparent 55%),
        radial-gradient(ellipse 55% 40% at 8% 88%, rgba(1,253,145,0.2) 0%, transparent 50%),
        #070604;
    }
    .cutout {
      position: absolute; right: -40px; top: 140px;
      width: 640px; height: auto;
      filter: drop-shadow(0 28px 60px rgba(90,210,208,0.35));
      transform: rotate(8deg);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 58% 52% at 50% 48%, #000 55%, transparent 78%);
      mask-image: radial-gradient(ellipse 58% 52% at 50% 48%, #000 55%, transparent 78%);
    }
    .top {
      position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; justify-content: space-between; align-items: center; z-index: 2;
    }
    .pill {
      background: #01FD91; color: #000; font-size: 20px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px;
    }
    .src { font-size: 22px; font-weight: 600; color: #5AD2D0; }
    .copy {
      position: absolute; left: 64px; bottom: 200px; width: 640px; z-index: 2;
    }
    h1 {
      font-size: 58px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.02;
      margin-bottom: 24px; text-shadow: 0 4px 40px rgba(0,0,0,0.85);
    }
    h1 .a { color: #01FD91; }
    .body {
      font-size: 30px; font-weight: 500; line-height: 1.3; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.9); max-width: 520px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.7);
    }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 56px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 44px; }
    .note { font-size: 22px; font-weight: 600; color: rgba(253,253,253,0.45); }
  </style>
</head>
<body>
  <div class="c">
    <img class="cutout" src="assets/phone-alert-cutout.png" alt="" />
    <div class="top">
      <div class="pill">Tech tip · Android</div>
      <div class="src">01 / 05</div>
    </div>
    <div class="copy">
      <h1>¿Tu Android puede avisarte de un terremoto <span class="a">antes</span> de que lo sientas?</h1>
      <p class="body">Sí. Y no es magia.</p>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="note">Desliza →</div>
    </div>
  </div>
</body>
</html>
