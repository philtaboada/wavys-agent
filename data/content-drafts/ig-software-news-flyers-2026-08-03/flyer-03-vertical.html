<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 03 — Vertical agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1350px; overflow: hidden;
      font-family: Rubik, system-ui, sans-serif;
      background: #070604; color: #FDFDFD;
    }
    .canvas {
      width: 1080px; height: 1350px; position: relative;
      display: grid; grid-template-rows: 1fr auto;
      background: #070604;
    }
    .split {
      display: grid; grid-template-columns: 1.05fr 0.95fr;
      min-height: 980px;
    }
    .left {
      padding: 80px 48px 48px 72px;
      background:
        radial-gradient(ellipse 100% 80% at 0% 100%, rgba(90, 210, 208, 0.2) 0%, transparent 60%),
        #070604;
      display: flex; flex-direction: column; justify-content: space-between;
      border-right: 1px solid rgba(253, 253, 253, 0.08);
    }
    .right {
      padding: 80px 64px 48px 48px;
      background:
        linear-gradient(180deg, rgba(1, 253, 145, 0.08) 0%, transparent 40%),
        #000908;
      display: flex; flex-direction: column; gap: 28px; justify-content: center;
    }
    .tag {
      font-size: 20px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #5AD2D0;
    }
    h1 {
      font-size: 64px; font-weight: 800; letter-spacing: -0.07em;
      line-height: 0.98; margin-top: 40px;
    }
    h1 .accent { color: #01FD91; }
    .big-num {
      font-size: 96px; font-weight: 800; letter-spacing: -0.08em;
      color: #01FD91; line-height: 1;
    }
    .big-num span {
      display: block; font-size: 28px; font-weight: 600;
      color: rgba(253, 253, 253, 0.7); letter-spacing: -0.02em; margin-top: 8px;
    }
    .vs {
      font-size: 22px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(253, 253, 253, 0.4);
      margin: 8px 0;
    }
    .card-bad, .card-good {
      border-radius: 24px; padding: 28px 28px;
      font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25;
    }
    .card-bad {
      background: rgba(253, 253, 253, 0.04);
      border: 1px solid rgba(253, 253, 253, 0.1);
      color: rgba(253, 253, 253, 0.55);
      text-decoration: line-through;
      text-decoration-color: rgba(253, 253, 253, 0.25);
    }
    .card-good {
      background: rgba(1, 253, 145, 0.12);
      border: 1px solid rgba(1, 253, 145, 0.45);
      color: #FDFDFD;
    }
    .card-good strong { color: #01FD91; }
    .bottom {
      background: linear-gradient(90deg, #5AD2D0, #01FD91);
      color: #000;
      padding: 40px 72px;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 160px;
    }
    .bottom p {
      font-size: 30px; font-weight: 700; letter-spacing: -0.03em;
      max-width: 640px; line-height: 1.2;
    }
    .logo-wrap {
      background: #070604; border-radius: 16px; padding: 14px 18px;
    }
    .logo { height: 36px; width: auto; display: block; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="split">
      <div class="left">
        <div>
          <div class="tag">Funding · Q3 2026</div>
          <h1>Vertical<br /><span class="accent">gana</span><br />a horizontal.</h1>
        </div>
        <div class="big-num">
          $1.8B
          <span>en agentes IA · julio 2026</span>
        </div>
      </div>
      <div class="right">
        <div class="vs">El mercado dice</div>
        <div class="card-bad">Agente genérico<br />“para todo”</div>
        <div class="card-good"><strong>Especialista</strong><br />por industria y flujo</div>
      </div>
    </div>
    <div class="bottom">
      <p>Tienda · Salón · Restaurante — no “IA para cualquiera”.</p>
      <div class="logo-wrap">
        <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      </div>
    </div>
  </div>
</body>
</html>
