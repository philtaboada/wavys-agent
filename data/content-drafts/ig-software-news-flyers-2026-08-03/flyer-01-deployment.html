<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 01 — Deployment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1350px; overflow: hidden;
      font-family: Rubik, system-ui, sans-serif;
      background: #070604;
      color: #FDFDFD;
    }
    .canvas {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 90% 55% at 80% 100%, rgba(1, 253, 145, 0.28) 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 10% 90%, rgba(90, 210, 208, 0.22) 0%, transparent 50%),
        #070604;
    }
    .glow-ring {
      position: absolute; right: -120px; top: 180px;
      width: 520px; height: 520px; border-radius: 50%;
      border: 2px solid rgba(1, 253, 145, 0.18);
      box-shadow: 0 0 80px rgba(90, 210, 208, 0.15);
    }
    .tag {
      position: absolute; top: 72px; left: 72px;
      font-size: 22px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #5AD2D0;
    }
    .card {
      position: absolute; left: 64px; right: 64px; top: 160px; bottom: 200px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(253, 253, 253, 0.08);
      border-radius: 40px;
      padding: 72px 64px;
      display: flex; flex-direction: column; justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    .source {
      font-size: 24px; font-weight: 500; color: rgba(253, 253, 253, 0.55);
    }
    .source strong { color: #5AD2D0; font-weight: 600; }
    h1 {
      font-size: 72px; font-weight: 800; line-height: 0.98;
      letter-spacing: -0.07em; max-width: 820px;
    }
    h1 .accent { color: #01FD91; display: block; margin-top: 12px; }
    .body {
      font-size: 30px; font-weight: 500; line-height: 1.35;
      letter-spacing: -0.02em; color: rgba(253, 253, 253, 0.88);
      max-width: 780px;
    }
    .footer {
      position: absolute; left: 72px; right: 72px; bottom: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 44px; width: auto; opacity: 0.95; }
    .cta {
      background: #01FD91; color: #000; font-size: 26px; font-weight: 700;
      padding: 18px 32px; border-radius: 20px; letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="glow-ring"></div>
    <div class="tag">Software · Empresas</div>
    <div class="card">
      <div class="source">Fuente: <strong>TechCrunch</strong> · 3 ago 2026</div>
      <h1>
        El problema no es la IA.
        <span class="accent">Es ponerla a trabajar.</span>
      </h1>
      <p class="body">
        June levanta $20M respaldada por Benioff. La lección: el cuello de botella ya no es el modelo — es integrarlo con tu operación real.
      </p>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="cta">Agenda demo</div>
    </div>
  </div>
</body>
</html>
