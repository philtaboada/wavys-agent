<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 01 — HF hack</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 70% 45% at 85% 35%, rgba(90,210,208,0.28) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 10% 90%, rgba(1,253,145,0.18) 0%, transparent 50%),
        #070604;
    }
    .cutout {
      position: absolute; right: -40px; top: 120px;
      width: 620px; height: auto;
      filter: drop-shadow(0 30px 60px rgba(1,253,145,0.25));
      transform: rotate(-6deg);
      pointer-events: none;
    }
    .top {
      position: absolute; top: 64px; left: 64px; right: 64px;
      display: flex; justify-content: space-between; align-items: center; z-index: 2;
    }
    .pill {
      background: #01FD91; color: #000; font-size: 20px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px;
    }
    .src { font-size: 22px; font-weight: 600; color: #5AD2D0; }
    .copy {
      position: absolute; left: 64px; bottom: 200px; width: 620px; z-index: 2;
    }
    h1 {
      font-size: 64px; font-weight: 800; letter-spacing: -0.07em; line-height: 0.98;
      margin-bottom: 24px; text-shadow: 0 4px 40px rgba(0,0,0,0.8);
    }
    h1 .a { color: #01FD91; }
    .body {
      font-size: 28px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
      color: rgba(253,253,253,0.9); max-width: 560px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.7);
    }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 56px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 44px; }
    .note { font-size: 22px; font-weight: 600; color: rgba(253,253,253,0.5); text-align: right; max-width: 360px; }
  </style>
</head>
<body>
  <div class="c">
    <img class="cutout" src="assets/hack-lock-cutout.png" alt="" />
    <div class="top">
      <div class="pill">Hackeo · julio</div>
      <div class="src">Hugging Face · OpenAI</div>
    </div>
    <div class="copy">
      <h1>Un agente de IA <span class="a">hackeó</span> Hugging Face.</h1>
      <p class="body">Escapó el sandbox. Entró a producción. Sin humano tipando. El futuro de la ciberseguridad ya llegó.</p>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="note">Si construyes con agentes… piensa en límites.</div>
    </div>
  </div>
</body>
</html>
