<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 02 — MiniMax H3</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; overflow: hidden; }
    .c {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 50% 40%, rgba(1,253,145,0.2) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 100% 0%, rgba(90,210,208,0.22) 0%, transparent 50%),
        #070604;
    }
    .bar { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: linear-gradient(90deg, #5AD2D0, #01FD91); }
    .tag {
      position: absolute; top: 56px; left: 64px; right: 64px; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tag span:first-child { font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5AD2D0; }
    .tag span:last-child { font-size: 22px; font-weight: 500; color: rgba(253,253,253,0.5); }
    .cutout {
      position: absolute; left: 50%; top: 140px; transform: translateX(-50%);
      width: 720px; height: auto;
      filter: drop-shadow(0 40px 80px rgba(90,210,208,0.3));
      z-index: 1;
    }
    .badge {
      position: absolute; left: 64px; top: 720px; z-index: 2;
      font-size: 120px; font-weight: 800; letter-spacing: -0.1em; line-height: 0.85;
      background: linear-gradient(180deg, #FDFDFD, #01FD91);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .badge small {
      display: block; font-size: 36px; font-weight: 700; letter-spacing: -0.04em;
      color: #5AD2D0; -webkit-background-clip: initial; background: none; margin-top: 8px;
    }
    .copy {
      position: absolute; left: 64px; right: 64px; bottom: 200px; z-index: 2;
    }
    h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.05; margin-bottom: 16px; }
    .body { font-size: 28px; font-weight: 500; line-height: 1.35; color: rgba(253,253,253,0.88); max-width: 900px; }
    .body strong { color: #01FD91; }
    .chips { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .chip {
      background: rgba(1,253,145,0.12); border: 1px solid rgba(1,253,145,0.4);
      border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700;
    }
    .footer {
      position: absolute; left: 64px; right: 64px; bottom: 56px; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { height: 44px; }
    .src { font-size: 22px; font-weight: 600; color: rgba(253,253,253,0.45); }
  </style>
</head>
<body>
  <div class="c">
    <div class="bar"></div>
    <div class="tag">
      <span>MiniMax H3 · 31 jul</span>
      <span>Video IA</span>
    </div>
    <img class="cutout" src="assets/video-frame-cutout.png" alt="" />
    <div class="badge">2K<small>+ audio nativo</small></div>
    <div class="copy">
      <h1>Video con sonido. En un solo modelo.</h1>
      <p class="body">H3 genera clips <strong>2K</strong> con stereo incluido — texto, imagen, video y audio juntos.</p>
      <div class="chips">
        <span class="chip">Texto</span>
        <span class="chip">Imagen</span>
        <span class="chip">Video</span>
        <span class="chip">Audio</span>
      </div>
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="src">minimax.io</div>
    </div>
  </div>
</body>
</html>
