<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 02 — OpenAI -80%</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; overflow: hidden; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; }
    .canvas {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(circle at 50% 35%, rgba(1, 253, 145, 0.2) 0%, transparent 45%),
        #070604;
    }
    .bar {
      position: absolute; top: 0; left: 0; right: 0; height: 12px;
      background: linear-gradient(90deg, #5AD2D0, #01FD91);
    }
    .tag {
      position: absolute; top: 72px; left: 72px; right: 72px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tag span:first-child {
      font-size: 22px; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: #5AD2D0;
    }
    .tag span:last-child { font-size: 22px; font-weight: 500; color: rgba(253,253,253,0.5); }
    .mega {
      position: absolute; left: 72px; right: 72px; top: 220px; text-align: center;
    }
    .mega .cut {
      font-size: 220px; font-weight: 800; letter-spacing: -0.1em; line-height: 0.85;
      background: linear-gradient(180deg, #FDFDFD 0%, #01FD91 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .mega .label {
      margin-top: 16px; font-size: 40px; font-weight: 700; letter-spacing: -0.04em; color: #5AD2D0;
    }
    h1 {
      position: absolute; left: 72px; right: 72px; top: 620px;
      font-size: 58px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.05; text-align: center;
    }
    .box {
      position: absolute; left: 64px; right: 64px; bottom: 200px;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(1,253,145,0.35);
      border-radius: 28px; padding: 36px 40px;
      font-size: 30px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
      text-align: center; color: rgba(253,253,253,0.92);
    }
    .box strong { color: #01FD91; }
    .footer {
      position: absolute; left: 72px; right: 72px; bottom: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { height: 44px; }
    .src { font-size: 22px; font-weight: 600; color: rgba(253,253,253,0.45); }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bar"></div>
    <div class="tag">
      <span>OpenAI · 30 jul</span>
      <span>GPT-5.6 Luna</span>
    </div>
    <div class="mega">
      <div class="cut">-80%</div>
      <div class="label">más barata la IA rápida</div>
    </div>
    <h1>Automatizar ya no es<br />“caro de probar”.</h1>
    <div class="box">
      OpenAI bajó Luna un <strong>80%</strong>. El costo del cerebro bajó.<br />
      Lo que sigue caro… es <strong>responder mal</strong> en WhatsApp.
    </div>
    <div class="footer">
      <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
      <div class="src">openai.com</div>
    </div>
  </div>
</body>
</html>
