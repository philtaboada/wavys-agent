<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Flyer 04 — CTA Wavys</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1350px; overflow: hidden; font-family: Rubik, system-ui, sans-serif; background: #070604; color: #FDFDFD; }
    .canvas {
      width: 1080px; height: 1350px; position: relative;
      background:
        radial-gradient(ellipse 100% 60% at 50% 100%, rgba(1, 253, 145, 0.32) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(90, 210, 208, 0.2) 0%, transparent 50%),
        #070604;
      padding: 64px;
      display: flex; flex-direction: column;
    }
    .logo { height: 48px; margin-bottom: 48px; align-self: flex-start; }
    .glass {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(253,253,253,0.1);
      border-radius: 40px;
      padding: 56px 48px;
      display: flex; flex-direction: column;
    }
    .kicker {
      font-size: 24px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: #5AD2D0; margin-bottom: 24px;
    }
    h1 {
      font-size: 58px; font-weight: 800; letter-spacing: -0.07em; line-height: 1.0;
      margin-bottom: 40px;
    }
    h1 .accent { color: #01FD91; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 20px; margin-bottom: auto; }
    .list li {
      font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25;
      padding-left: 36px; position: relative;
    }
    .list li::before {
      content: ""; position: absolute; left: 0; top: 12px;
      width: 16px; height: 16px; border-radius: 4px;
      background: linear-gradient(135deg, #5AD2D0, #01FD91);
    }
    .cta-block { margin-top: 48px; }
    .cta {
      display: inline-block;
      background: #01FD91; color: #000;
      font-size: 34px; font-weight: 800; letter-spacing: -0.03em;
      padding: 24px 40px; border-radius: 20px; margin-bottom: 20px;
    }
    .sub {
      font-size: 26px; font-weight: 500; color: rgba(253,253,253,0.55);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="logo" src="../../brand-assets/logos/logo-wavys-technologies.png" alt="Wavys" />
    <div class="glass">
      <div class="kicker">Entonces, ¿qué haces?</div>
      <h1>No compitas por <span class="accent">ruido</span>. Compite por <span class="accent">respuesta útil</span>.</h1>
      <ul class="list">
        <li>WhatsApp está filtrando y cobrando más</li>
        <li>La IA está más barata — úsala con criterio</li>
        <li>Wavys OS: chat-first para Tienda, Salón o Restaurante</li>
      </ul>
      <div class="cta-block">
        <div class="cta">Agenda demo →</div>
        <div class="sub">20 min · Calendly<br />calendly.com/philtaboada2julio</div>
      </div>
    </div>
  </div>
</body>
</html>
